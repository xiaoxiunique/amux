[package]
name = "amux"
version = "0.5.22"
edition = "2021"
description = "Run AI coding agents in per-directory persistent tmux sessions"
license = "MIT"

[[bin]]
name = "amux"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
dirs = "5"
anyhow = "1"
rusqlite = { version = "0.34", features = ["bundled"] }
ratatui = "0.28"
crossterm = "0.28"
tempfile = "3"

# serve (agent-monitor)
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
portable-pty = "0.9"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"], default-features = false }
include_dir = "0.7"
# TLS for the dsh relay. Browsers refuse to open a WebSocket from a page
# served over plain HTTP on a non-loopback address, so the relay has to
# terminate TLS itself.
tokio-rustls = "0.26"
rustls-pemfile = "2"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

# Optional — only pulled in by the `full` feature (agent-port host build).
jsonwebtoken = { version = "9", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Optional (full feature): per-window screenshot needs the CG window list.
core-graphics = { version = "0.24", optional = true }
core-foundation = { version = "0.10", optional = true }

[features]
# `amux serve --features full` = the full agent-port host service: adds the
# macOS control-center (apps + screenshots), token-usage, and APNs push
# endpoints on top of the core session monitor.
full = ["dep:jsonwebtoken", "dep:core-graphics", "dep:core-foundation", "reqwest/http2"]

[dev-dependencies]
