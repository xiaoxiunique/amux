[package]
name = "amux"
version = "0.1.0"
edition = "2021"
description = "Run AI coding agents in per-directory persistent tmux sessions"
license = "MIT"

[[bin]]
name = "amux"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
sha2 = "0.10"
dirs = "5"
anyhow = "1"
rusqlite = { version = "0.34", features = ["bundled"] }
ratatui = "0.28"
crossterm = "0.28"
tempfile = "3"

[dev-dependencies]
