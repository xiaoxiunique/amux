[package]
name = "amux"
version = "0.2.0"
edition = "2021"
description = "Run AI coding agents in per-directory persistent tmux sessions"
license = "MIT"

[[bin]]
name = "amux"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
dirs = "5"
anyhow = "1"
rusqlite = { version = "0.34", features = ["bundled"] }
ratatui = "0.28"
crossterm = "0.28"
tempfile = "3"

# serve (agent-monitor)
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
portable-pty = "0.9"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"], default-features = false }
libc = "0.2"
include_dir = "0.7"

[dev-dependencies]
